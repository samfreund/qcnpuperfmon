name: Build Debian package

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb (arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper cmake pkg-config

      - name: Install libfastrpc + libqcnpuperf from Debian pool
        run: |
          DEBPOOL=https://deb.debian.org/debian/pool/contrib
          wget -q "${DEBPOOL}/f/fastrpc/libfastrpc1_1.0.2-2_arm64.deb"
          wget -q "${DEBPOOL}/f/fastrpc/libfastrpc-dev_1.0.2-2_arm64.deb"
          wget -q "${DEBPOOL}/libq/libqcnpuperf/libqcnpuperf1_1.0.0-1_arm64.deb"
          wget -q "${DEBPOOL}/libq/libqcnpuperf/libqcnpuperf-dev_1.0.0-1_arm64.deb"
          sudo dpkg -i libfastrpc1_1.0.2-2_arm64.deb \
                        libfastrpc-dev_1.0.2-2_arm64.deb \
                        libqcnpuperf1_1.0.0-1_arm64.deb \
                        libqcnpuperf-dev_1.0.0-1_arm64.deb

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../*.deb dist/ 2>/dev/null || true

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qcnpuperfmon-debs-${{ github.sha }}
          path: dist/*.deb

      - name: Cleanup previous dev release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete dev --yes --cleanup-tag || true

      - name: Dev Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev Build
          prerelease: true
          files: dist/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
