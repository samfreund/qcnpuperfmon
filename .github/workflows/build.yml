name: Build Debian package

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb (arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-qcom-iot/qcom-ppa
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper cmake pkg-config \
            qcom-fastrpc-dev libfastrpc1 libfastrpc-dev

      - name: Install libqcnpuperf from Debian pool
        run: |
          POOL=https://deb.debian.org/debian/pool/contrib/libq/libqcnpuperf
          wget -q "${POOL}/libqcnpuperf1_1.0.0-1_arm64.deb"
          wget -q "${POOL}/libqcnpuperf-dev_1.0.0-1_arm64.deb"
          sudo dpkg -i libqcnpuperf1_1.0.0-1_arm64.deb \
                        libqcnpuperf-dev_1.0.0-1_arm64.deb

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qcnpuperfmon-debs-${{ github.sha }}
          path: ../*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ../*.deb
